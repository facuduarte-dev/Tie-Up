    <link rel="stylesheet" href="../css/navbar.css" />
  </head>
  <body class="page-with-navbar">
    <header class="site-header">
      <nav class="navBar">
        <div class="logo">
          <img
            src="../docs/tie-up/logo-tie-up-transparente.png"
            alt="Logo de DevConnect"

        </div>

        <div class="navLinks">

        </div>
      </nav>
    </header>

    <h2>Publicar servicios</h2>
    <p>Comparte tu talento y conecta con nuevos clientes</p>

    <form method="POST">
      <label for="service-title">Título del servicio</label>
      <input id="service-title" name="title" type="text" placeholder="Ej.: Diseño de sitio web profesional" />

      <label for="service-category">Categoría</label>
      <input id="service-category" name="category" type="text" placeholder="Seleccione una categoría" />

      <label for="service-specialty">Especialidad</label>
      <input id="service-specialty" name="specialty" type="text" placeholder="Ej.: Sitios web" />

      <label for="service-description">Descripción</label>
      <input
        id="service-description"
        name="description"
        type="text"
        placeholder="Describe qué ofreces y qué incluye el servicio..."
      />

      <div>
        <label for="service-price">Precio (USD)</label>
        <input id="service-price" name="price" type="number" min="0" placeholder="Ej.: 150" />

        <label for="delivery-time">Plazo de entrega</label>
        <input id="delivery-time" name="delivery_time" type="text" placeholder="Ej.: 7 días" />
      </div>

      <label for="service-file">Archivo del servicio</label>
      <input id="service-file" name="service_file" type="file" />
      <button type="submit">Publicar servicio</button>
    </form>
  </body>
