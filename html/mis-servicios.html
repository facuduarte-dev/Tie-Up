    <h2><span data-i18n="publicar-servicios-2">Publicar servicios</span></h2>
    <p><span data-i18n="comparte-tu-talento-y-conecta-con-nuevos-clientes">Comparte tu talento y conecta con nuevos clientes</span></p>

    <form method="POST">
      <label for="service-title"><span data-i18n="titulo-del-servicio">Título del servicio</span></label>
      <input id="service-title" name="title" type="text" placeholder="Ej.: Diseño de sitio web profesional" data-i18n="placeholder:ej-diseno-de-sitio-web-profesional" />

      <label for="service-category"><span data-i18n="categoria">Categoría</span></label>
      <input id="service-category" name="category" type="text" placeholder="Seleccione una categoría" data-i18n="placeholder:seleccione-una-categoria" />

      <label for="service-specialty"><span data-i18n="especialidad">Especialidad</span></label>
      <input id="service-specialty" name="specialty" type="text" placeholder="Ej.: Sitios web" data-i18n="placeholder:ej-sitios-web" />

      <label for="service-description"><span data-i18n="descripcion">Descripción</span></label>
      <input
        id="service-description"
        name="description"
        type="text"
        placeholder="Describe qué ofreces y qué incluye el servicio..." data-i18n="placeholder:describe-que-ofreces-y-que-incluye-el-servicio"
      />

      <div>
        <label for="service-price"><span data-i18n="precio-usd">Precio (USD)</span></label>
        <input id="service-price" name="price" type="number" min="0" placeholder="Ej.: 150" data-i18n="placeholder:ej-150" />

        <label for="delivery-time"><span data-i18n="plazo-de-entrega">Plazo de entrega</span></label>
        <input id="delivery-time" name="delivery_time" type="text" placeholder="Ej.: 7 días" data-i18n="placeholder:ej-7-dias" />
      </div>

      <label for="service-file"><span data-i18n="archivo-del-servicio">Archivo del servicio</span></label>
      <input id="service-file" name="service_file" type="file" />
      <button type="submit"><span data-i18n="publicar-servicio">Publicar servicio</span></button>
    </form>
  </body>
